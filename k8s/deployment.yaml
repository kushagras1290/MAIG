apiVersion: apps/v1
kind: Deployment
metadata:
  name: maig-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: maig-gateway
  template:
    metadata:
      labels:
        app: maig-gateway
    spec:
      containers:
        - name: gateway
          image: maig-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: AI_PROVIDER
              value: mock
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: maig-secrets
                  key: api-token
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
